[project]
name = "design-studio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.135.0", "uvicorn[standard]==0.37.0", "sqlalchemy==2.0.43", "psycopg[binary]==3.2.10", "alembic==1.16.5", "httpx==0.28.1", "python-multipart>=0.0.31", "pillow>=12.3.0", "pydantic-settings==2.11.0"]
[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
