# Enable only after certbot issued and nginx -t succeeds.
server {
    listen 80;
    server_name studio.mein-kuechenexperte.de;
    location ^~ /.well-known/acme-challenge/ { root /var/www/design-studio-acme; try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name studio.mein-kuechenexperte.de;
    ssl_certificate /etc/letsencrypt/live/design-studio-review/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/design-studio-review/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 13m;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
}
