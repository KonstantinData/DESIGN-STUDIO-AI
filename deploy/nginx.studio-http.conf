# Candidate for the selected review host only. Enable only with verified TLS.
# HTTP is for ACME; do not transmit review credentials over plaintext HTTP.
server {
    listen 80;
    server_name studio.mein-kuechenexperte.de;
    client_max_body_size 13m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/design-studio-acme;
        try_files $uri =404;
    }
    location / {
        # INITIAL LOCAL VALIDATION ONLY: replace with return 308 https://$host$request_uri
        # after the separate, real-certificate HTTPS site is validated.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
}
